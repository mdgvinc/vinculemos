<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Exitoso</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      color: #333;
      padding: 40px;
    }
    .box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 60px auto;
    }
    h1 {
      color: #28a745;
    }
    p {
      margin: 15px 0;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #28a745;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    a:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>¡Pago Exitoso! 🎉</h1>
    <p>Tu reserva ha sido confirmada.</p>
    <p>Revisa tu correo para más detalles.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
